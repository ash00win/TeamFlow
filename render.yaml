databases:
  - name: teamflow-db
    plan: free

services:
  - type: redis
    name: teamflow-redis
    plan: free
    ipAllowList: []

  - type: web
    name: teamflow-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: teamflow-web-10tl.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      - key: DATABASE_URL
        fromDatabase:
          name: teamflow-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: teamflow-redis
          property: connectionString

# Celery worker/beat are omitted here: Render's free plan doesn't support
# the Background Worker service type. Nothing in the request/response path
# depends on them - they only matter for the scheduled email jobs in
# accounts/tasks.py. Run them locally via `docker compose up` (see
# docker-compose.yml), or add teamflow-celery-worker/-beat as Background
# Worker services manually if you upgrade to a paid Render plan.
