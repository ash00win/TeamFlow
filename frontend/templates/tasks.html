<!DOCTYPE html>
<html>
<head>
<title>Tasks</title>

<style>

body{
font-family:'Segoe UI';
background:#f4f6f9;
margin:0;
}

.sidebar{
width:220px;
height:100vh;
background:#1e293b;
color:white;
position:fixed;
padding-top:30px;
}

.sidebar a{
display:block;
padding:12px 25px;
color:white;
text-decoration:none;
}

.sidebar a:hover{
background:#334155;
}

.main{
margin-left:220px;
padding:30px;
}

.task-card{
background:white;
padding:15px;
margin-bottom:12px;
border-radius:8px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.task-form{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:20px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}
.task-row{
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
}
input, select{
padding:10px;
margin-right:10px;
border:1px solid #ddd;
border-radius:6px;
}

button{
padding:10px 18px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

</style>

</head>

<body>

<div class="sidebar">

<h2 style="text-align:center;">TeamFlow</h2>

<a href="/dashboard/">Dashboard</a>
<a href="/projects/">Projects</a>
<a href="/tasks/">Tasks</a>
<a href="/upgrade/">Upgrade Plan</a>
<a href="#" onclick="logout()">Logout</a>

</div>

<div class="main">

<h1>Tasks</h1>

<div class="task-form">

    <div class="task-row">
    
    <input id="title" placeholder="Task Title">
    
    <select id="project"></select>
    
    <select id="status">
    <option value="TODO">TODO</option>
    <option value="IN_PROGRESS">IN PROGRESS</option>
    <option value="DONE">DONE</option>
    </select>
    
    <button onclick="createTask()">Create Task</button>
    
    </div>
    
    </div>

<div id="tasks"></div>

</div>

<script>

    const token = localStorage.getItem("token");
    
    if(!token){
    window.location="/";
    }
    
    
    // =====================
    // Load Projects for Dropdown
    // =====================
    
    async function loadProjects(){
    
    let res = await fetch("/api/projects/",{
    headers:{
    Authorization:"Bearer "+token
    }
    })
    
    let data = await res.json();
    
    let html="";
    
    data.forEach(p=>{
    html += `<option value="${p.id}">${p.name}</option>`
    })
    
    document.getElementById("project").innerHTML = html;
    
    }
    
    
    // =====================
    // Load Tasks
    // =====================
    
    async function loadTasks(){
    
    console.log("Loading tasks...");
    
    let res = await fetch("/api/tasks/",{
    headers:{
    Authorization:"Bearer "+token
    }
    })
    
    let data = await res.json();
    
    let html="";
    
    data.forEach(t=>{
    html+=`
    <div class="task-card">
    
    <strong>${t.title}</strong><br>
    
    Status: ${t.status}
    
    </div>
    `
    })
    
    document.getElementById("tasks").innerHTML=html;
    
    }
    
    
    // =====================
    // Create Task
    // =====================
    
    async function createTask(){
    
    console.log("Create button clicked");
    
    let title=document.getElementById("title").value;
    let project=document.getElementById("project").value;
    let status=document.getElementById("status").value;
    
    if(!title){
    alert("Please enter task title");
    return;
    }
    
    let res = await fetch("/api/tasks/",{
    method:"POST",
    headers:{
    "Content-Type":"application/json",
    Authorization:"Bearer "+token
    },
    body:JSON.stringify({
    title:title,
    project:project,
    status:status
    })
    })
    
    console.log("Response:", res.status);
    
    if(res.ok){
    
    console.log("Task created");
    
    // clear field
    document.getElementById("title").value="";
    
    // reload tasks
    loadTasks()
    
    }else{
    
    let text = await res.text();
    console.log(text);
    alert("Task creation failed");
    
    }
    
    }
    
    
    // =====================
    // Initial Page Load
    // =====================
    
    loadProjects()
    loadTasks()

function logout(){

localStorage.removeItem("token")

window.location="/"

}

    </script>
</body>
</html>
